name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH + rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: backend/ frontend/
          remote_path: /home/${{ secrets.VM_USER }}/todo-list-vps/
          remote_host: ${{ secrets.VM_HOST }}
          remote_port: ${{ secrets.VPS_PORT }}
          remote_user: ${{ secrets.VM_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Restart backend and copy frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            sudo cp -r /home/${{ secrets.VM_USER }}/todo-list-vps/frontend/* /var/www/html/
            cd /home/${{ secrets.VM_USER }}/todo-list-vps/backend
            npm install
            pm2 restart todo-backend
